<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman tidak ditemukan | ENLab</title>
  <meta name="robots" content="noindex">
  <!-- Halaman ini sengaja mandiri: ia dapat disajikan pada kedalaman URL mana pun,
       sehingga jalur relatif ke CSS atau gambar tidak dapat diandalkan. -->
  <style>
    :root { color-scheme: light; --bg:#f7f9fc; --card:#fff; --text:#142744;
            --strong:#06152b; --muted:#586984; --brand:#0a4f96; --line:#dae2ef; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg:#050e1c; --card:#0b1828; --text:#dbe6f5;
              --strong:#fff; --muted:#8ea3c1; --brand:#5da4ea; --line:#1d3049; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px;
           background:var(--bg); color:var(--text); text-align:center;
           font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; line-height:1.6; }
    .card { max-width:540px; background:var(--card); border:1px solid var(--line);
            border-radius:26px; padding:clamp(28px,5vw,52px); }
    .code { font-size:.74rem; font-weight:800; letter-spacing:.14em;
            text-transform:uppercase; color:var(--brand); }
    h1 { font-size:clamp(1.6rem,4vw,2.3rem); margin:14px 0 12px; color:var(--strong);
         letter-spacing:-0.03em; line-height:1.2; }
    p { color:var(--muted); margin:0 0 26px; }
    a.btn { display:inline-block; background:var(--brand); color:#fff; font-weight:700;
            padding:13px 26px; border-radius:999px; text-decoration:none; }
    a.btn:hover { opacity:.9; }
  </style>
</head>
<body>
  <main class="card">
    <span class="code">Error 404</span>
    <h1>Halaman tidak ditemukan</h1>
    <p>
      Tautan yang Anda buka mungkin sudah dipindahkan atau salah ketik.<br>
      <span lang="en">The page you requested could not be found.</span>
    </p>
    <a class="btn" href="https://ekanurfani92.github.io/enlab/">Kembali ke beranda</a>
  </main>
</body>
</html>
